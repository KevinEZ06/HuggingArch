# RMSNorm that writes its output already quantised — the norm with no
# residual add in front of it, read by a quantised GEMM.
#
# Naive subgraph:
#   rmsnorm: z = rmsnorm(x, weight)
#   quant:   z_q, scales = quantise_activation(z)    # the graft's cast
#
# The cast exists only where a quantised GEMM reads the normed row
# (`inference.materialize_cast`), and the launch takes it only when it is
# the row's one reader (`fusion.Fusion._closed`): a consumer that wants the
# row wide keeps the norm and the cast apart. Typical site: MLA's
# `q_a_layernorm`, whose row only the query up-projection (and, under DSA,
# the indexer's `wq_b` through the same cast) reads.
#
# This is the residual-free half of the rule `fused_add_rmsnorm` states for
# its optional `quant` member, and it is a plan of its own because the cast
# is what makes it a launch: without one a bare `rmsnorm` is a single node
# and there is nothing to fuse. So `quant` is REQUIRED here.
#
# Plans that also hold this norm are tried first by their shape
# (`framework_bindings.match_order`), not by file order: a launch that
# writes the norm and can take its cast — `fused_add_rmsnorm` (add, norm,
# optional cast), `fused_q_kv_rmsnorm` (two norms, optional cast on q) — has
# as many required nodes as this pattern and one more node in all, so an
# add + norm + cast chain is the add's launch and a q/kv a-norm pair stays
# one launch with q's cast in it. This plan sees only the norms no other
# launch writes.
#
# vLLM (audited at v0.32.0): `RMSNormQuantFusionPass`
# (compilation/passes/fusion/rms_quant_fusion.py:772) registers the bare-norm
# patterns beside the fused-add ones — static FP8 (:802), dynamic per-token
# FP8 (:810) and per-group FP8 for groups of 128 and 64 (`RMSNormGroupQuantPattern`
# :463, registered :828-835) — rewriting the pair into one launch
# (`rms_norm_static_fp8_quant` / `rms_norm_dynamic_per_token_quant` /
# `rms_norm_per_block_quant`, :189-205). The pass runs when `fuse_norm_quant`
# (on from -O1, the default being -O2, config/vllm.py:427, :271, :292) and
# `enable_norm_fusion` hold (:149-156); a block-FP8 checkpoint turns the
# `quant_fp8` custom op on (:1733-1748), which is what makes it hold for
# DeepSeek-V3 / R1 / Kimi-K2. Their MLA calls `q_a_layernorm` then `q_b_proj`
# in the compiled forward (model_executor/layers/mla.py:190, :221).
#
# Declared assumptions — where the graph fuses more than the audited
# frameworks do, it keeps the better form, with no `architectures` gate and
# no narrowing by format:
#   (a) The vLLM fusion is an Inductor pass, so it reaches only compiled
#       forwards. Model classes whose attention runs eager — DeepSeek-V3.2 /
#       GLM-5 (`DeepseekV32Attention`), DeepSeek-V4.1, Kimi-K3 — quantise the
#       normed row in a launch of its own there; the plan still takes the
#       cast for them.
#   (b) The audited pass registers the bare-norm patterns for FP8 only
#       (static, per-token, per-group 128 / 64); there is none for NVFP4 or
#       MXFP4. The plan takes the cast whatever activation format it
#       writes.
# sglang (audited at v0.5.22) does not fuse a block-FP8 (per-group) quant
# into a bare norm: its only norm + quant fold is a static per-tensor FP8
# scale (`RMSNorm.fuse_input_quant`, srt/layers/layernorm.py:505-509, taken in
# `forward_cuda` :551-560), and the per-token / per-group quant is a launch
# of its own. The binding prices the better form all the same, as
# `fused_add_rmsnorm`'s optional cast does: taking the cast into its one
# writer is the graph's rule, not a per-framework fact.
#
# Measurement: the span is measured under the `rmsnorm` signature, keyed by
# the record it writes (`output`, `activation_granularity`, `metadata`). Two
# vLLM kernels serve it: `rms_norm_per_block_quant` (FP8 e4m3, fp32 scales
# per 64 or 128, BF16 row and gain) and `rms_norm_dynamic_per_token_quant`
# for an FP8 per-token record. The cells the shipped corpus plans at its
# shipped precision (vLLM and sglang bindings, B200) and who serves them:
#   * FP8 per-group:128, fp32 scales, BF16 gain — the block-FP8 checkpoints
#     (DeepSeek-V3, MiniMax-M2.7, MiMo-V2*, …): `vllm_rms_norm_per_block_quant`.
#   * FP8 per-token, fp32 scales — Ling-2.6-1T: `vllm_rms_norm_per_token_quant`.
#   * MISSING — FP8 per-group:128 with UE8M0 scales (DeepSeek-V4-Flash / -Pro,
#     both bindings). vLLM's kernel writes fp32 scales only: its signature has
#     no scale-format argument (_custom_ops.py:443-452), and the pass replaces
#     even its `is_e8m0` group patterns with the same op and no UE8M0 flag
#     (rms_quant_fusion.py:526-537, registered :815-835), so it does not
#     write this record and its provider (metadata fp32) declines the cell.
#   * MISSING — FP8 per-group:32 with UE8M0 scales (DeepSeek-V4.1-Flash under
#     sglang): no kernel declares a 32-wide group for this norm.
#   * MISSING — FP8 per-group:128 behind an fp32-stored gain (DeepSeek-V3.2 /
#     -Exp under sglang): the provider declares a BF16 gain.
#   * MISSING when planned — NVFP4 and MXFP4 records (`fp4_e2m1` output): no
#     provider writes FP4 from this norm. No shipped checkpoint plans one at
#     its shipped precision; a deployment precision that quantises the GEMM
#     input to FP4 would. (vLLM's NVFP4 norm fusion, FlashInfer's, is
#     registered for the residual form only, rms_quant_fusion.py:680, :790-796.)
# sglang ships no kernel for any of these cells (see above); its cells are
# the same physical cells as vLLM's and are measured by vLLM's launch — the
# better form the plan prices — where one serves them.

fused_op: fused_rmsnorm_quant

naive_pattern:
  nodes:
    rmsnorm: { op: rmsnorm,             inputs: [external.x] }
    quant:   { op: quantise_activation, inputs: [rmsnorm.out] }
  io_mapping:
    x:      external.x
    output: quant.out
