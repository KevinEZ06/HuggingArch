name: fly recover

on:
  push:
    branches: [main]
  workflow_dispatch: {}

jobs:
  recover:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - name: Show and restart the machine
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          set -euo pipefail
          flyctl machines list -a huggingarch
          volume_json=$(flyctl volumes list -a huggingarch -o json)
          echo "$volume_json"
          volume_id=$(jq -r '.[0].id // .[0].ID' <<<"$volume_json")
          volume_size=$(jq -r '.[0].size // .[0].size_gb // .[0].SizeGb' <<<"$volume_json" | tr -dc '0-9')
          test -n "$volume_id"
          if [ "${volume_size:-0}" -lt 20 ]; then
            # The release bootstrap needs room for the archive, its expanded
            # install and the lake already on this persistent volume.
            flyctl volumes extend "$volume_id" --size 20 -a huggingarch
          fi
          # The failed deploy cleared its machine lease; start the already
          # downloaded retry image without going through another rollout.
          flyctl machine start 811d5e2c504e18 -a huggingarch
          flyctl logs -a huggingarch --machine 811d5e2c504e18 --no-tail || true
          for _ in $(seq 1 120); do
            code=$(curl -sS --max-time 5 -o /dev/null \
              -w '%{http_code}' https://www.huggingarch.com/health || true)
            if [ "$code" = 200 ]; then
              flyctl status -a huggingarch
              exit 0
            fi
            sleep 15
          done
          flyctl logs -a huggingarch --machine 811d5e2c504e18 --no-tail || true
          flyctl status -a huggingarch
          exit 1
