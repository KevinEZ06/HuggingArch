name: fly recover

on:
  push:
    branches: [main]
  workflow_dispatch: {}

jobs:
  recover:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - name: Show and restart the machine
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          set -euo pipefail
          flyctl machines list -a huggingarch
          flyctl volumes list -a huggingarch
          # The production app has one attached cache volume; extend it in
          # place. The archive, expanded install and lake no longer fit in 3 GB.
          flyctl volumes extend vol_vjyo0y3m3w628wpv --size 20 -a huggingarch
          # The failed deploy cleared its machine lease; start the already
          # downloaded retry image without going through another rollout.
          flyctl machine start 811d5e2c504e18 -a huggingarch
          flyctl logs -a huggingarch --machine 811d5e2c504e18 --no-tail || true
          for _ in $(seq 1 120); do
            code=$(curl -sS --max-time 5 -o /dev/null \
              -w '%{http_code}' https://www.huggingarch.com/health || true)
            if [ "$code" = 200 ]; then
              flyctl status -a huggingarch
              exit 0
            fi
            sleep 15
          done
          flyctl logs -a huggingarch --machine 811d5e2c504e18 --no-tail || true
          flyctl status -a huggingarch
          exit 1
