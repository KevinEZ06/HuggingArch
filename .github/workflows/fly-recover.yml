name: fly recover

on:
  push:
    branches: [main]
  workflow_dispatch: {}

jobs:
  recover:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - name: Show and restart the machine
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          set -euo pipefail
          code=$(curl -sS --max-time 5 -o /dev/null \
            -w '%{http_code}' https://www.huggingarch.com/health || true)
          if [ "$code" = 200 ]; then
            flyctl status -a huggingarch
            exit 0
          fi
          flyctl machines list -a huggingarch
          volumes=$(flyctl volumes list -a huggingarch --json)
          echo "$volumes"
          size_gb=$(jq -r '.[] | select(.id == "vol_vjyo0y3m3w628wpv" \
              or .ID == "vol_vjyo0y3m3w628wpv") \
            | .size // .size_gb // .SizeGb // .SizeGB' <<<"$volumes" \
            | tr -dc '0-9')
          if [ "${size_gb:-0}" -lt 20 ]; then
            # The archive, expanded install and lake no longer fit in 3 GB.
            flyctl volumes extend vol_vjyo0y3m3w628wpv --size 20 -a huggingarch
          fi
          # Start the already downloaded image; this is a no-op when running.
          flyctl machine start 811d5e2c504e18 -a huggingarch
          flyctl logs -a huggingarch --machine 811d5e2c504e18 --no-tail || true
          for _ in $(seq 1 120); do
            code=$(curl -sS --max-time 5 -o /dev/null \
              -w '%{http_code}' https://www.huggingarch.com/health || true)
            if [ "$code" = 200 ]; then
              flyctl status -a huggingarch
              exit 0
            fi
            sleep 15
          done
          flyctl logs -a huggingarch --machine 811d5e2c504e18 --no-tail || true
          flyctl status -a huggingarch
          exit 1
