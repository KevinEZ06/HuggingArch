name: fly recover

on:
  push:
    branches: [main]
  workflow_dispatch: {}

jobs:
  recover:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - name: Show and restart the machine
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          set -euo pipefail
          flyctl machines list -a huggingarch
          # A cold artifact bootstrap can take much longer than flyctl's
          # health-check default.  Restart without waiting, then let the
          # bootstrap finish; logs expose a deterministic failure instead of
          # reporting success for a started-but-unhealthy machine.
          flyctl machine restart 811d5e2c504e18 -a huggingarch \
            --skip-health-checks
          flyctl logs -a huggingarch --machine 811d5e2c504e18 --no-tail || true
          for _ in $(seq 1 180); do
            code=$(curl -sS --max-time 5 -o /dev/null \
              -w '%{http_code}' https://www.huggingarch.com/health || true)
            if [ "$code" = 200 ]; then
              flyctl status -a huggingarch
              exit 0
            fi
            sleep 10
          done
          flyctl logs -a huggingarch --machine 811d5e2c504e18 --no-tail || true
          flyctl status -a huggingarch
          exit 1
