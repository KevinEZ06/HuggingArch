# Nightly auto-upgrade of the HuggingFace model-loading stack.
#
# WHY: the deployed image builds with `uv sync --frozen`, so it only ships
# whatever `uv.lock` pins; without this job transformers goes stale and
# brand-new models can't build their skeleton.
#
# This job re-locks the model-loading stack (transformers + its tight
# companions), syncs the pyproject floor, runs the golden surface gate, and
# commits straight to main. It does not run the test suite itself: the push
# triggers the `tests` workflow, and `deploy` ships the commit only after that
# run passes — so a bump that breaks analysis never reaches prod.
#
# The push uses the GitHub App token: a push made with GITHUB_TOKEN would not
# trigger the tests / deploy workflows.

name: update-transformers

on:
  schedule:
    # 02:17 Asia/Shanghai daily (18:17 UTC) — off the hour to avoid the cron crush.
    - cron: "17 18 * * *"
  workflow_dispatch: {}   # allow manual "upgrade now" runs

permissions:
  contents: read

concurrency:
  group: update-transformers
  cancel-in-progress: false

jobs:
  relock:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Mint GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ vars.HA_GITHUB_APP_ID || secrets.HA_GITHUB_APP_ID }}
          private-key: ${{ secrets.HA_GITHUB_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}

      - uses: actions/checkout@v4
        with:
          ref: main
          token: ${{ steps.app-token.outputs.token }}

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Set up Python
        run: uv python install 3.13

      - name: Re-lock the model-loading stack
        run: |
          uv lock \
            --upgrade-package transformers \
            --upgrade-package tokenizers \
            --upgrade-package safetensors \
            --upgrade-package huggingface-hub \
            --upgrade-package accelerate

      - name: Detect lock change
        id: lock
        run: |
          if git diff --quiet -- uv.lock; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "The model-loading stack is already up to date — nothing to do."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            NEW=$(grep -A1 'name = "transformers"' uv.lock | grep version | head -1 | sed -E 's/.*"(.*)".*/\1/')
            echo "transformers=$NEW" >> "$GITHUB_OUTPUT"
            echo "uv.lock changed; transformers now $NEW"
          fi

      - name: Sync deps (verify lock is consistent)
        if: steps.lock.outputs.changed == 'true'
        run: uv sync --frozen

      # Keep the pyproject floor at the locked version so the manifest doesn't
      # drift behind the lockfile.
      - name: Sync pyproject floor to locked version
        if: steps.lock.outputs.changed == 'true'
        run: |
          uv run python - <<'EOF'
          import pathlib, re
          new = "${{ steps.lock.outputs.transformers }}"
          p = pathlib.Path("pyproject.toml")
          text = p.read_text()
          updated, n = re.subn(r'"transformers>=[0-9.]+"', f'"transformers>={new}"', text, count=1)
          if n != 1:
              raise SystemExit(f"expected 1 transformers floor in pyproject.toml, found {n}")
          p.write_text(updated)
          print(f"pyproject floor → transformers>={new}")
          EOF

      # Same golden gate as scripts/gate.sh: a bump that changes what the
      # analyzer says is on disk must NOT auto-ship. When this fails the bump
      # may still be legitimate — a human re-baselines the goldens locally
      # (scripts/gate.sh) and lands the bump by hand.
      - name: Golden gate — checkpoint names + storage surface
        if: steps.lock.outputs.changed == 'true'
        run: |
          uv run python scripts/dump_tensor_names.py > /tmp/gate_names.txt
          diff -u tests/golden/tensor_names.txt /tmp/gate_names.txt
          uv run python scripts/dump_storage_surface.py > /tmp/gate_storage.txt
          diff -u tests/golden/storage_surface.txt /tmp/gate_storage.txt

      - name: Commit to main
        if: steps.lock.outputs.changed == 'true'
        run: |
          git config user.name "huggingarch-bot"
          git config user.email "huggingarch-bot@users.noreply.github.com"
          git add uv.lock pyproject.toml
          git commit -m "deps: upgrade model-loading stack (transformers ${{ steps.lock.outputs.transformers }})"
          git push origin HEAD:main
